<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demo Shop — QA Practice App</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 20px; margin-bottom: 24px; }
  input { display: block; width: 100%; box-sizing: border-box; margin: 8px 0; padding: 10px; font-size: 15px; }
  button { padding: 10px 18px; font-size: 15px; cursor: pointer; }
  .error { color: #b91c1c; min-height: 1.2em; }
  .welcome { color: #15803d; font-weight: bold; }
  ul { list-style: none; padding: 0; }
  li { display: flex; justify-content: space-between; align-items: center;
       border: 1px solid #eee; border-radius: 6px; padding: 8px 12px; margin: 6px 0; }
  li.done span { text-decoration: line-through; color: #888; }
  #login-section.logged-in form { display: none; }
</style>
</head>
<body>

<div class="card" id="login-section">
  <h2>Sign in</h2>
  <form id="login-form">
    <input id="username" name="username" placeholder="Username" autocomplete="username">
    <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password">
    <p class="error" id="login-error" role="alert"></p>
    <button type="submit" id="login-btn">Sign in</button>
  </form>
  <p class="welcome" id="welcome-msg" hidden></p>
  <button id="logout-btn" hidden>Sign out</button>
</div>

<div class="card">
  <h2>Todo list</h2>
  <form id="todo-form">
    <input id="todo-input" placeholder="What needs doing?" aria-label="New todo">
    <button type="submit" id="add-btn">Add</button>
  </form>
  <p class="error" id="todo-error" role="alert"></p>
  <ul id="todo-list"></ul>
  <p id="todo-count">0 items</p>
</div>

<script>
// ---- login: only demo/demo succeeds ---------------------------------------
const form = document.getElementById('login-form');
form.addEventListener('submit', e => {
  e.preventDefault();
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  const err = document.getElementById('login-error');
  if (!u || !p) { err.textContent = 'Username and password are required.'; return; }
  if (u === 'demo' && p === 'demo') {
    err.textContent = '';
    document.getElementById('login-section').classList.add('logged-in');
    const w = document.getElementById('welcome-msg');
    w.textContent = `Welcome back, ${u}!`;
    w.hidden = false;
    document.getElementById('logout-btn').hidden = false;
  } else {
    err.textContent = 'Invalid username or password.';
  }
});
document.getElementById('logout-btn').addEventListener('click', () => {
  document.getElementById('login-section').classList.remove('logged-in');
  document.getElementById('welcome-msg').hidden = true;
  document.getElementById('logout-btn').hidden = true;
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
});

// ---- todo list -------------------------------------------------------------
const todos = [];
const list = document.getElementById('todo-list');
function render() {
  list.innerHTML = '';
  todos.forEach((t, i) => {
    const li = document.createElement('li');
    if (t.done) li.classList.add('done');
    const label = document.createElement('span');
    label.textContent = t.text;   // textContent, never innerHTML with user input
    li.append(label);
    const toggle = document.createElement('button');
    toggle.textContent = t.done ? 'Undo' : 'Done';
    toggle.setAttribute('aria-label', (t.done ? 'Mark not done: ' : 'Mark done: ') + t.text);
    toggle.addEventListener('click', () => { todos[i].done = !todos[i].done; render(); });
    const del = document.createElement('button');
    del.textContent = 'Delete';
    del.setAttribute('aria-label', 'Delete: ' + t.text);
    del.addEventListener('click', () => { todos.splice(i, 1); render(); });
    const wrap = document.createElement('span');
    wrap.append(toggle, del);
    li.append(wrap);
    list.append(li);
  });
  document.getElementById('todo-count').textContent =
    `${todos.length} item${todos.length === 1 ? '' : 's'}`;
}
document.getElementById('todo-form').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('todo-input');
  const err = document.getElementById('todo-error');
  const text = input.value.trim();
  if (!text) { err.textContent = 'Todo text cannot be empty.'; return; }
  err.textContent = '';
  // NOTE: innerHTML-free insertion on purpose — text is set via textContent
  todos.push({ text, done: false });
  input.value = '';
  render();
});
render();
</script>
</body>
</html>
